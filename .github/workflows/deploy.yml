name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare (scanner.sayalabs.in)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # >= 22.3: the security suite uses the experimental, flag-gated
          # `mock.module` API to forge Clerk identities. On an older runtime the
          # bypass tests cannot load and the whole file errors out.
          node-version: "22.3"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # `npm test` now runs scripts/test-rls-migration.sh, which boots a
      # throwaway Postgres to prove the RLS lockdown actually applies. Ubuntu
      # runners ship PostgreSQL client binaries; install the server so
      # initdb/pg_ctl are on PATH. If they are missing the script skips rather
      # than failing, so this step is belt-and-braces.
      - name: Install PostgreSQL server
        run: |
          if ! command -v initdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql postgresql-contrib
            for p in /usr/lib/postgresql/*/bin; do
              if [ -x "$p/initdb" ]; then
                echo "$p" >> "$GITHUB_PATH"
                export PATH="$p:$PATH"
                break
              fi
            done
          fi
          initdb --version

      # Security tripwire. `npm test` runs the functional suite AND the bypass
      # suites; it exits non-zero if an authorization regression is introduced,
      # which blocks the deploy below.
      - name: Run automated test suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build OpenNext Cloudflare bundle
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_ALLOWED_EMAIL: ${{ secrets.ADMIN_ALLOWED_EMAIL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          OPEN_NEXT_ORIGIN: https://scanner.sayalabs.in

      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '74d877492e541ba6d459990fff4fad12' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_ALLOWED_EMAIL: ${{ secrets.ADMIN_ALLOWED_EMAIL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          OPEN_NEXT_ORIGIN: https://scanner.sayalabs.in
